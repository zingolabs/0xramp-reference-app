plugins {
  id "com.android.library"
  id "expo-module-gradle-plugin"
}

group = "expo.modules.zingowallet"
version = "1.0.0"

android {
  namespace "expo.modules.zingowallet"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles "consumer-rules.pro"
  }
}

dependencies {
  implementation "net.java.dev.jna:jna:5.18.1@aar"
}
