[workspace]
members = ["zingo-wallet-ffi", "uniffi-bindgen"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
http = "1"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-util = "0.7.11"
uniffi = "=0.32.1"
zcash_address = "=0.14.0"
zcash_client_backend = { version = "=0.25.0", features = ["orchard", "transparent-inputs"] }
zcash_protocol = "=0.11.0"
zingolib = { git = "https://github.com/zingolabs/zingolib", branch = "dev" }
zip32 = "0.3.0"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
overflow-checks = true
